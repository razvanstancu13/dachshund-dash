<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #120f2a; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #120f2a; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40vw; max-width: 420px;
                 font: 600 18px system-ui, sans-serif; color: #ffe9b8; text-align: center; }
      #bar { margin-top: 12px; height: 12px; border-radius: 6px; background: #3a2a1c; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #ffb84d; transition: width .2s; }
      #warning { position: fixed; left: 0; right: 0; top: 0; color: #fff; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">{{{ PRODUCT_NAME }}}<div id="bar"><div id="fill"></div></div></div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function showBanner(msg, type) {
        if (type != 'error') { console.log(msg); return; }
        var d = document.createElement('div');
        d.style = 'background: #b3261e; padding: 10px;';
        d.innerHTML = msg;
        document.querySelector("#warning").appendChild(d);
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };
      canvas.focus();
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = () => {
        createUnityInstance(canvas, config, (p) => {
          document.querySelector("#fill").style.width = 100 * p + "%";
        }).then(() => {
          document.querySelector("#loading").style.display = "none";
          canvas.focus();
        }).catch((message) => alert(message));
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
